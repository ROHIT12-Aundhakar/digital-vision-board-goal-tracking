<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Signup</title>

  <link
  rel="stylesheet"
  href="style.css">

</head>

<body>

  <div class="auth-container">

    <h1>Create Account 🚀</h1>

    <input
    type="text"
    id="signupUsername"
    placeholder="Username">

    <input
    type="email"
    id="signupEmail"
    placeholder="Email">

    <input
    type="password"
    id="signupPassword"
    placeholder="Password">

    <button onclick="signup()">

      Signup

    </button>

    <p>

      Already have account?

      <a href="login.html">

        Login

      </a>

    </p>

  </div>

  <script src="script.js"></script>

</body>

</html>
